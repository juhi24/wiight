[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "wiight"
dynamic = ["version"]
description = "Read weight from a Wii Balance Board and publish it over MQTT"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
keywords = ["wii", "balance-board", "scale", "mqtt", "home-assistant"]
authors = [
  { name = "Jussi Tiira", email = "jussi@j24.fi" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Home Automation",
]
dependencies = [
  "numpy",
  "click",
]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2,<3"]
dev = [
  "coverage[toml]>=6.5",
  "mypy>=1.0",
  "pytest>=8",
]

[project.urls]
Documentation = "https://github.com/juhi24/wiight#readme"
Issues = "https://github.com/juhi24/wiight/issues"
Source = "https://github.com/juhi24/wiight"

[project.scripts]
wiight = "wiight.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.envs.default]
system-packages = true
dependencies = [
  "coverage[toml]>=6.5",
  "pytest",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "coverage run -m pytest {args:tests}"
cov-report = [
  "- coverage combine",
  "coverage report",
]
cov = [
  "test-cov",
  "cov-report",
]

[[tool.hatch.envs.all.matrix]]
python = ["3.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "hardware: requires a paired physical Wii Balance Board",
  "mqtt_broker: requires a reachable MQTT broker",
]

[tool.hatch.envs.types]
dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/wiight tests}"

[tool.coverage.run]
source_pkgs = ["wiight", "tests"]
branch = true
parallel = true
omit = [
  "src/wiight/__about__.py",
]

[tool.coverage.paths]
wiight = ["src/wiight", "*/wiight/src/wiight"]
tests = ["tests", "*/wiight/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
