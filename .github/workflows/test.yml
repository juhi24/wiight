name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,mqtt]"
      - name: Test
        run: pytest -q
      - name: Type check
        run: mypy src/wiight
      - name: Build
        run: python -m pip wheel --no-deps --wheel-dir dist .